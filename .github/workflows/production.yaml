name: Netlify Production Deployment

on:
  push:
    branches:
      - main
      - master

env:
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

jobs:
  Deploy-Production-Shared:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@9a88f495971c09574545e0ea0c2f6228b851e77a

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Install Netlify CLI
        run: pnpm add -g netlify-cli@17.23

      - name: Set environment variables from secrets and create .env file
        run: |
          echo "${{ vars.ENV_FILE }}" > .env

      - name: Build Project Artifacts
        run: pnpm bazel build //adev:build

      - name: Rename index.csr.html
        run: mv ./dist/bin/adev/build/browser/index.csr.html ./dist/bin/adev/build/browser/index.html

      - name: Deploy Project Artifacts to Netlify
        run: |
          netlify deploy \
            --dir ./adev/dist/browser \
            --skip-functions-cache \
            --prod \
            --message "Action-${{ github.ref_name }}-${{ github.event.head_commit.message }}"