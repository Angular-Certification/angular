name: Netlify Preview Deployment

on:
  pull_request:
    branches:
      - main

env:
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    environment: Preview

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set environment variables from secrets and create .env file
        run: |
          echo "${{ vars.ENV_FILE }}" > .env

      - name: Build adev
        run: pnpm exec bazel build //adev:build --jobs=2 --local_ram_resources=5120

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/netlify-deploy
          cp -RL ./dist/bin/adev/dist/browser /tmp/netlify-deploy/browser
          chmod -R u+w /tmp/netlify-deploy/browser
          mv /tmp/netlify-deploy/browser/index.csr.html /tmp/netlify-deploy/browser/index.html
          cp ./_redirects /tmp/netlify-deploy/browser/_redirects

      - name: Install Netlify CLI
        run: pnpm add -g netlify-cli@17.23

      - name: Deploy Project Artifacts to Netlify
        working-directory: /tmp/netlify-deploy
        run: |
          echo "Calculating meaningful string as alias"
          ALIAS=$(node -e "console.log('${{github.run_id}} ${{github.event.number}} ${{github.event.pull_request.title}}'.replaceAll(' ','-').substring(0,37))")
          echo "Alias: $ALIAS"
          netlify deploy \
            --site $NETLIFY_SITE_ID \
            --dir ./browser \
            --skip-functions-cache \
            --alias $ALIAS \
            --message "GH Action-${{github.ref_name}}-${{github.event.number}}_${{github.event.pull_request.title}}" \
            --json \
            > ./deploy_output.json
